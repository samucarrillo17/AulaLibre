services:
  db:
    image: postgres:14.3
    restart: 'always'
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    container_name: AulaLibreBD
    volumes:
      - ./postgres:/var/lib/postgresql/data
  redis:
    image: redis:7.2
    restart: 'always'
    ports:
      - "6379:6379"
    container_name: aula-libre-redis
  